name: 뉴스 요약 갱신 및 배포

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (미국 장 마감 후)
    - cron: "0 12 * * *"   # 매일 21:00 KST (미국 장 시작 전)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write    # summary.json 커밋
  pages: write
  id-token: write
  actions: write     # 워크플로 자동 재활성화
  models: read       # GitHub Models 무료 AI 호출

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 뉴스 요약 생성
        id: summarize
        continue-on-error: true   # 실패하면 직전 요약을 그대로 배포
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/summarize.py

      - name: 요약 저장 (커밋이 저장소 활동으로 남아 예약 실행 중지를 막음)
        if: steps.summarize.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary.json
          git diff --cached --quiet || git commit -m "뉴스 요약 갱신"
          git push

      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp index.html _site/
          if [ -f summary.json ]; then cp summary.json _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 워크플로 활성 상태 유지
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "${{ github.repository }}" || true
